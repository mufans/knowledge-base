<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f2ea">
  <title>Knowledge Control Center</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Knowledge Control Center 总览">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span><strong>Knowledge Loop</strong><small>CONTROL CENTER</small></span>
      </a>
      <nav class="primary-nav" aria-label="主导航">
        <a href="#overview" data-route="overview"><span aria-hidden="true">◫</span>流水线总览</a>
        <a href="#signals" data-route="signals"><span aria-hidden="true">⌁</span>证据与质量</a>
        <a href="#opportunities" data-route="opportunities"><span aria-hidden="true">◇</span>机会与实验</a>
        <a href="#tasks" data-route="tasks"><span aria-hidden="true">✓</span>任务与调度</a>
        <a href="#reports" data-route="reports"><span aria-hidden="true">▤</span>分析转化</a>
        <a href="#monitoring" data-route="monitoring"><span aria-hidden="true">⌁</span>服务健康</a>
      </nav>
      <div class="sidebar-foot">
        <div class="connection-status">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-label">正在加载数据</span>
        </div>
        <small>数据按需拉取，每 60 秒自动刷新一次</small>
      </div>
    </aside>
    <main id="main-content" class="main" tabindex="-1" aria-live="polite" aria-busy="true">
      <section class="loading-state" data-state="loading">
        <p class="eyebrow">知识控制面</p>
        <h1>正在加载数据</h1>
        <p>本页按需拉取聚合指标，不建立长连接。身份验证完成后才会读取授权数据。</p>
      </section>
    </main>
  </div>
  <script type="module" src="/static/app.js?v=4"></script>
</body>
</html>
